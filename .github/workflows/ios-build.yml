name: Build iOS (macOS runner)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build Runner.app (sem assinatura)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign 2>&1 | tee ios_build.log

      - name: Upload log de build (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios_build.log
          if-no-files-found: warn

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: build/ios/iphoneos/Runner.app
