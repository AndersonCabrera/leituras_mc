name: Build iOS (macOS runner)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build Runner.app (sem assinatura)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign 2>&1 | tee ios_build.log

      - name: Coletar diagnostico
        if: always()
        shell: bash
        run: |
          {
            echo "=== flutter --version ==="
            flutter --version 2>&1 | head -5
            echo "=== xcodebuild -version ==="
            xcodebuild -version 2>&1 | head -3
            echo "=== ESTRUTURA (.app/.xcarchive) ==="
            find build -maxdepth 6 \( -name "*.app" -o -name "*.xcarchive" \) -print 2>/dev/null
            echo "=== build/ios ==="
            ls -la build/ios 2>/dev/null || echo "(sem build/ios)"
            echo "=== build ==="
            ls -la build 2>/dev/null
            echo "=== TAIL LOG (60) ==="
            tail -n 60 ios_build.log 2>/dev/null || echo "(sem log)"
          } | tr '\n' ' ' | sed 's/%/%25/g;s/\r//g' > diag_line.txt
          echo "::warning title=Diagnostico-build::$(cat diag_line.txt)"

      - name: Upload diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diag
          path: diag_line.txt
          if-no-files-found: warn

      - name: Upload log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios_build.log
          if-no-files-found: warn

      - name: Upload Runner.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: build/ios/**/Runner.app
          if-no-files-found: warn
