name: Build iOS (macOS runner)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    name: Build Runner.app (sem assinatura)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log
          status=${PIPESTATUS[0]}
          echo "FLUTTER_EXIT_CODE=$status"
          exit $status

      - name: Coletar diagnostico
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== LINHAS DE ERRO ==="
            grep -n -iE "error:|failed|fatal|cannot find|unable to|no such|exception|undefined symbol|CommandPhaseScript" ios_build.log 2>/dev/null | tail -25
            echo "=== FINAL DO LOG (ultimos 20000 bytes) ==="
            tail -c 20000 ios_build.log 2>/dev/null
          } | tr '\n' ' ' | sed 's/%/%25/g;s/\r//g' > diag_line.txt
          msg=$(head -c 16000 diag_line.txt)
          echo "::warning title=Diagnostico-build::$msg" || true

      - name: Upload diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diag
          path: diag_line.txt
          if-no-files-found: warn

      - name: Upload log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios_build.log
          if-no-files-found: warn

      - name: Upload Runner.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: build/ios/**/Runner.app
          if-no-files-found: warn
